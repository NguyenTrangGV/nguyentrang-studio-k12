name: Studio K12 - staging QA
on:
  push:
    branches:
      - ai/studio-qa-staging
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify HTML structure and inline JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          p=Path("index.html")
          assert p.exists(), "Missing index.html"
          s=p.read_text(encoding="utf-8")
          assert "<html" in s.lower() and "</html>" in s.lower(), "Invalid HTML shell"
          scripts=re.findall(r'<script\\b[^>]*>(.*?)</script>',s,re.I|re.S)
          for i,script in enumerate(scripts):
              if not script.strip(): continue
              with tempfile.NamedTemporaryFile(mode="w",suffix=".js",delete=False) as f:
                  f.write(script); name=f.name
              subprocess.run(["node","--check",name],check=True)
          print(f"PASS: HTML shell; {len(scripts)} script blocks")
          PY
