name: Studio K12 - staging QA
on:
  push:
    branches: [ai/studio-qa-staging]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check HTML and JavaScript
        run: python3 tests/check_studio.py index.html
